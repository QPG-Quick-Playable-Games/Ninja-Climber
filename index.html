<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ninja Climber</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game-wrap">
    <canvas id="game"></canvas>
    <div id="hud">
      <div id="score">Score: 0</div>
      <div id="powerups"></div>
    </div>

    <div id="overlay" class="visible">
      <div class="modal">
        <h1>Ninja Climber</h1>
        <p>Do you want to play on PC or Mobile?</p>
        <div class="buttons">
          <button id="pcBtn">PC - Keyboard (← → or A D)</button>
          <button id="mobileBtn">Mobile - Tap to switch</button>
        </div>
        <p class="hint">Collect coins (+10). Avoid spikes. Use power-ups for bonuses!</p>
      </div>
    </div>

    <div id="gameOver" class="hidden">
      <div class="modal">
        <h2>Game Over</h2>
        <p id="finalScore">Score: 0</p>
        <button id="restartBtn">Play Again</button>
      </div>
    </div>

  </div>

  <script src="js/script.js"></script>
</body>
</html>
